baseURL = "https://nathan.swiss/"
languageCode = "en-US"
theme = "hugo-fraktur-theme"
themesDir = "themes"
enableRobotsTXT = false
title = "Nathan Buache"
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true

# Disable taxonomies (tags, categories) completely
disableKinds = ["taxonomy", "term"]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  description = "Nathan Buache — Senior Test Manager and QA Specialist based in Lausanne, Switzerland. Blog, projects, and insights on quality assurance and software testing."
  google_analytics_id = "G-FFR91K2J2Y"
  showIntroContentOnHomepage = true
  showPostsOnHomepage = false
  homePageSubtitle = "Senior Test Manager & QA Specialist in Lausanne, Switzerland"

  # --- v1.2: Footer attribution
  themeName = "Fraktur"
  themeRepo = "https://github.com/nthnbch/hugo-fraktur-theme"

  # --- v1.2: Inter est auto-hébergée dans le thème (static/fonts/)
  # Google Fonts n'est plus nécessaire
  enableGoogleFonts = false

# markdown config settings https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

[menu]
  [[menu.main]]
    name = "Home"
    identifier = "home"
    weight = 1
    url = "/"
  [[menu.main]]
    name = "Blog"
    identifier = "posts"
    weight = 2
    url = "/posts/"
  [[menu.main]]
    name = "Info"
    identifier = "info"
    weight = 3
    url = "/info/"
  [[menu.main]]
    name = "Projects"
    identifier = "projects"
    weight = 4
    url = "/projects/"